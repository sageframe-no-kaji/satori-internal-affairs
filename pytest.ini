# Root pytest config — audit S1.
#
# Used ONLY for combined runs from the repo root (pytest packages/...).
# Per-package runs resolve each package's own pyproject config first and
# never reach this file. Combined runs previously loaded no config at all,
# so live-LLM tests weren't deselected and per-package markers warned as
# unknown. Keep marker definitions in sync with the package pyprojects.

[pytest]
addopts = -m "not live_llm and not integration"
markers =
    live_llm: marks tests that require a live LLM API key (deselect with '-m not live_llm')
    integration: marks tests as integration tests requiring API keys (deselect with '-m "not integration"')
