# Root mypy config — audit S1 (report C-3).
#
# mypy resolves its config from the invocation cwd, not the target directory,
# so `make typecheck` from the repo root previously ran with non-strict
# defaults and the per-package [tool.mypy] blocks never applied. This file
# mirrors those blocks so root invocation is strict. Per-package configs
# remain for in-package invocation; keep the two in sync.

[mypy]
python_version = 3.11
strict = True
warn_return_any = True
warn_unused_configs = True

# openai / anthropic are optional extras of llm-client; imports are guarded
# at runtime. Mirrors llm-client's own [[tool.mypy.overrides]].
[mypy-openai]
ignore_missing_imports = True

[mypy-anthropic]
ignore_missing_imports = True

# types-PyYAML is declared in anamnesis's dev extras, but the ambient
# homebrew mypy runs in its own isolated environment and cannot see the
# target environment's stub packages. Remove this override with the uv
# migration (audit C-4), which runs mypy inside the pinned project env.
[mypy-yaml]
ignore_missing_imports = True
