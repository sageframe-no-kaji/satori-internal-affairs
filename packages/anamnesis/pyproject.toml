[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anamnesis"
version = "0.1.0"
description = "LLM-powered medical case generation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "types-PyYAML>=6.0",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.20.0",
]
all = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
]

[tool.pytest.ini_options]
markers = [
    "live_llm: marks tests that require a live LLM API key (deselect with '-m not live_llm')",
]
addopts = "-m 'not live_llm'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
