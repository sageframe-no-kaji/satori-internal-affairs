[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satori-api"
version = "0.1.0"
description = "FastAPI bridge server exposing the Satori engine over HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "satori",
    "llm-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.uv.sources]
satori = { workspace = true }
llm-client = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
