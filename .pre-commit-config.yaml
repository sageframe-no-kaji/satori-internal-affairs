# Verification gate — audit S1 (report C-3). LINT → TYPE-CHECK → TEST at
# every commit; a commit does not happen unless all hooks are green.
#
# All hooks run the ambient toolchain (language: system) until the uv
# migration (audit C-4) pins a committed project environment. Requires:
# ruff, mypy, pytest + pytest-cov, and the four packages installed editable.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check packages/
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format (check)
        entry: ruff format --check packages/
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy strict (root config)
        entry: mypy packages/satori/src packages/anamnesis/src packages/llm-client/src packages/satori-api/src
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-satori
        name: pytest satori (coverage >= 90)
        entry: pytest packages/satori/tests --cov=satori --cov-fail-under=90 -q
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-anamnesis
        name: pytest anamnesis (coverage >= 90)
        entry: pytest packages/anamnesis/tests --cov=anamnesis --cov-fail-under=90 -q
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-llm-client
        # Exempt from the 90% floor until P2-H08 rewrites the provider
        # implementations and their tests (audit/FABLE-REVIEW-2026-07-03.md §3:
        # provider tests importorskip the SDKs and cover ~0% of those files).
        name: pytest llm-client (coverage measured, floor deferred to P2-H08)
        entry: pytest packages/llm-client/tests --cov=llm_client -q
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-satori-api
        name: pytest satori-api (coverage >= 90)
        entry: pytest packages/satori-api/tests --cov=satori_api --cov-fail-under=90 -q
        language: system
        pass_filenames: false
        always_run: true
